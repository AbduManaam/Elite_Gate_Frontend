name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    name: Build & Test Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm' # change to 'pnpm' or 'yarn' if you use them

      - name: Install dependencies
        run: npm ci # Uses clean install from package-lock.json

      - name: Run Linter
        run: npm run lint

      - name: Run Tests
        run: npm run test -- --ci --coverage

      - name: Build Application
        run: npm run build
